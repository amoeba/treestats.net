# Polling is opt-in. List each server to poll by its name from
# data/servers.rb. A blank URL polls the standard root endpoint, e.g.
# http://play.example.net:9000/. A URL overrides that default.
#
# How often each target is polled. Friendly units: 15m, 1hr, 6 hours, 1d.
# Minute intervals must divide an hour evenly; hour intervals must divide a day.
interval: 15m
#
# Example:
#
# targets:
#   "ServerName":
#   "Other Server": https://status.example.net/data.json
targets:
  "Hollowtide PK": "https://hollowtide.org/population.json"
