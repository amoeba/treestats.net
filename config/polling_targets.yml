# Polling is opt-in. Each server is listed by its name from data/servers.rb
# and declares whether it is enabled. An omitted url polls the standard root
# endpoint, e.g. http://play.example.net:9000/, over HTTP first with HTTPS as
# a fallback. A url overrides that default and is used as-is, but the name
# must still appear in data/servers.rb. The url must be an absolute http(s)
# URL without credentials, a fragment, or a port outside 1-65535.
#
# How often each target is polled. Friendly units: 15m, 1hr, 6 hours, 1d.
# Minute intervals must divide an hour evenly; hour intervals must divide a day.
interval: 15m
#
# Example:
#
# targets:
#   "ServerName":
#     enabled: true
#   "Other Server":
#     enabled: true
#     url: https://status.example.net/data.json
#   "Not Ready Yet":
#     enabled: false
targets:
  # Hollowtide still serves the old flat {"count", "updated_at"} document.
  # Re-enable once its endpoint serves the standard document.
  "Hollowtide PK":
    enabled: false
    url: https://hollowtide.org/population.json
