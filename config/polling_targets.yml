# Polling targets for fetching server data from public HTTP endpoints
#
# How often each target is polled. Friendly units: 15m, 1hr, 6 hours, 1d.
# Minute intervals must divide an hour evenly; hour intervals must divide a day.
interval: 15m
#
# Example:
#
# targets:
#   "ServerName": https://status.example.net/data.json
targets:
  "Hollowtide PK": "https://hollowtide.org/population.json"
