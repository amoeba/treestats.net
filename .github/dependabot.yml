version: 2

updates:
  - package-ecosystem: bundler
    directory: "/"
    # Preserve Gemfile compatibility constraints, including connection_pool < 3.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
      day: monday
    groups:
      gems:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
